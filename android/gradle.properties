org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
## If you see an error like:
##   Android Gradle plugin requires Java 17 to run. You are currently using Java 11.
## then install a JDK 17 (for example Temurin/Adoptium or Eclipse Adoptium) and either:
## 1) set your system JAVA_HOME to the JDK 17 install, or
## 2) set Gradle to use a specific JDK by uncommenting and editing the line below with your JDK 17 path:
## org.gradle.java.home=C:/Program Files/Java/jdk-17
##
## Example PowerShell commands (run as your user):
## choco install temurin17 -y            # (if you use Chocolatey)
## setx JAVA_HOME "C:\Program Files\Eclipse Adoptium\jdk-17"  # adjust path to the JDK you installed
## Then restart your terminal/IDE.
